<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>研究地图</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect width='26' height='26' rx='6' fill='%231F5FBF'/%3E%3Cg fill='%23fff'%3E%3Crect x='3.5' y='6' width='5' height='5' rx='1.2'/%3E%3Crect x='10.5' y='10.5' width='5' height='5' rx='1.2'/%3E%3Crect x='17.5' y='6' width='5' height='5' rx='1.2'/%3E%3Crect x='17.5' y='15' width='5' height='5' rx='1.2'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<style id="map-style">
:root{
  --desk:#E6EAED;--paper:#FFFFFF;
  --ink:#1C2733;--ink-2:#55626E;--ink-3:#8B97A2;--rule:#D6DCE1;--rule-2:#E8ECEF;
  --pencil:#1F5FBF;--pencil-ink:#174A96;--pencil-wash:rgba(31,95,191,.09);
  --answer:#2D7A4B;--doing:#B86E0A;--danger:#B3261E;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Map Latin Punct","Noto Serif CJK SC","Source Han Serif SC","Songti SC",SimSun,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --gutter:56px;
}
/* Curly quotes and dashes in English text must not fall through to a CJK font, which sets them full width. */
@font-face{font-family:"Map Latin Punct";src:local("Georgia"),local("Palatino Linotype"),local("Liberation Serif"),local("DejaVu Serif"),local("Times New Roman");unicode-range:U+2013-2014,U+2018-201F,U+2026}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pencil);outline-offset:2px}
[hidden]{display:none!important}
#app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto auto auto minmax(0,1fr)}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:12px 20px 10px;min-width:0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:0 1 auto}
.brand .logo{flex:none;color:var(--pencil);display:grid}
.tw{display:flex;flex-direction:column;min-width:0}
.title-in{border:0;background:transparent;font:600 19px/1.25 var(--serif);padding:1px 4px;margin:-1px -4px;border-radius:6px;width:26ch;max-width:34vw;min-width:8ch;text-overflow:ellipsis}
.sub-in{border:0;background:transparent;font-size:12px;color:var(--ink-2);padding:1px 4px;margin:1px -4px 0;border-radius:5px;width:44ch;max-width:34vw;text-overflow:ellipsis}
.title-in:hover,.sub-in:hover{background:rgba(255,255,255,.65)}
.title-in:focus,.sub-in:focus{background:#fff;outline:2px solid var(--pencil);outline-offset:0}
.spacer{flex:1}
.legend{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--ink-2);white-space:nowrap;min-width:0;overflow:hidden}
.legend span{display:inline-flex;align-items:center;gap:5px;flex:none}
.legend span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.search{position:relative;display:flex;align-items:center}
.search input{width:200px;height:32px;border:1px solid var(--rule);border-radius:8px;background:#fff;padding:0 10px 0 30px}
.search input:focus{outline:2px solid var(--pencil);outline-offset:-1px;border-color:transparent}
.search.has-q input{padding-right:52px}
.search svg{position:absolute;left:9px;color:var(--ink-3);pointer-events:none}
.search .hits{position:absolute;right:9px;font-size:11.5px;color:var(--ink-2);pointer-events:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--rule);background:#fff;border-radius:8px;white-space:nowrap;line-height:1}
.btn:hover{border-color:#B6C0C9}
.btn.primary{background:var(--pencil);border-color:var(--pencil);color:#fff}
.btn.primary:hover{background:var(--pencil-ink);border-color:var(--pencil-ink)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:rgba(28,39,51,.06)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.icon{width:32px;padding:0}
.btn.sm.icon{width:28px}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.38;cursor:default}
.save{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save i{width:7px;height:7px;border-radius:50%;background:var(--answer);flex:none}
.save.idle i{background:var(--ink-3)}.save.warn i{background:#C77700}.save.err i{background:var(--danger)}
.save .txt{overflow:hidden;text-overflow:ellipsis}
.banner{margin:0 20px 8px;padding:9px 12px 9px 14px;border-radius:8px;background:#FFF8E6;box-shadow:0 0 0 1px #F0D58A;color:#6B4D00;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner span{flex:1;min-width:220px}
.tabs{display:none;gap:4px;padding:0 12px 8px}
.tabs button{flex:1;height:34px;border:1px solid var(--rule);background:#fff;border-radius:8px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.tabs button[aria-pressed="true"]{background:var(--pencil-wash);border-color:var(--pencil);color:var(--pencil-ink);font-weight:600}

/* workspace: three columns, two gutters for the wires */
#ws{position:relative;display:grid;grid-template-columns:minmax(0,1fr) var(--gutter) minmax(0,1.08fr) var(--gutter) minmax(0,1fr);padding:0 20px 18px;min-height:0}
.gutter{pointer-events:none}
.col{display:flex;flex-direction:column;min-height:0;min-width:0}
.col-head{display:flex;align-items:center;gap:10px;padding:4px 4px 12px 2px;min-width:0}
.col-head .no{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:600 13px/1 var(--sans)}
.col-head .ht{min-width:0;flex:1}
.col-head h2{margin:0;font-size:15px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-head .hs{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-head .count{font-size:12px;color:var(--ink-3);white-space:nowrap;flex:none}
.col-body{flex:1;min-height:0;overflow:auto;padding:2px 6px 64px 2px;scrollbar-width:thin;overscroll-behavior:contain;position:relative}
.empty{color:var(--ink-2);padding:20px 18px;font-size:13px;line-height:1.65;background:rgba(255,255,255,.55);border:1.5px dashed var(--rule);border-radius:10px}

/* cards */
.kc{position:relative;background:var(--paper);border-radius:10px;padding:11px 16px 11px 18px;margin:0 0 10px;box-shadow:0 1px 2px rgba(28,39,51,.07),0 10px 24px -16px rgba(28,39,51,.28);cursor:pointer;transition:opacity .2s,box-shadow .15s,background-color .15s;outline-offset:2px}
.kc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:10px 0 0 10px;background:var(--c,#B6C0C9)}
.kc:hover{box-shadow:0 0 0 1px #C3CDD6,0 10px 26px -14px rgba(28,39,51,.32)}
.kc.is-focus{box-shadow:0 0 0 2px var(--pencil),0 12px 30px -14px rgba(31,95,191,.45)}
.ch{display:flex;align-items:baseline;gap:7px;min-width:0;padding-right:4px}
.ch .code{font:650 11.5px/1 var(--sans);color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none;min-width:18px}
.ch .t{font-size:14px;font-weight:600;line-height:1.42;overflow-wrap:anywhere;min-width:0;flex:0 1 auto}
.cm2{display:flex;flex-wrap:wrap;gap:3px 12px;align-items:center;margin:4px 0 0 25px;font-size:12px;color:var(--ink-2)}
.cat{display:inline-flex;align-items:center;gap:5px;color:var(--c);font-weight:500}
.cat::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.st{display:inline-flex;align-items:center;gap:5px;color:var(--ink-2)}
.st i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink-3);flex:none}
.st.doing{color:var(--doing)}.st.doing i{border-color:var(--doing);background:linear-gradient(90deg,var(--doing) 50%,transparent 50%)}
.st.done{color:var(--answer)}.st.done i{border-color:var(--answer);background:var(--answer)}
.own{color:var(--ink-2)}
.own::before{content:"@";color:var(--ink-3);margin-right:1px}
.sum{margin:6px 0 0 25px;font:13.5px/1.58 var(--serif);color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.sum .katex{font-size:1em}
.foot{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0 25px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;background:#F1F4F6;color:var(--ink-2);font-size:11.5px;white-space:nowrap}
.pill.ok{background:#E3F1E8;color:var(--answer)}
.thumbs{display:flex;gap:6px;margin:8px 0 0 25px}
.thumbs img,.thumbs .miss{height:48px;width:auto;max-width:96px;object-fit:cover;border-radius:5px;box-shadow:0 0 0 1px var(--rule);background:#F4F6F8}
.thumbs .miss{width:64px;display:grid;place-items:center;font-size:11px;color:var(--ink-3)}
.thumbs .more-n{font-size:12px;color:var(--ink-2);align-self:center}

/* ports, focus, search, linking */
.port{position:absolute;top:21px;width:13px;height:13px;margin-top:-6.5px;border-radius:50%;border:1.5px solid var(--ink-3);background:#fff;cursor:crosshair;opacity:0;transition:opacity .15s,transform .15s;touch-action:none;z-index:2}
.port.r{right:-7px}.port.l{left:-7px}
.kc:hover .port,.kc.is-focus .port,.kc:focus-visible .port{opacity:1}
.port:hover{border-color:var(--pencil);background:var(--pencil-wash);transform:scale(1.25)}
body.linking .kc{cursor:crosshair}
body.linking .kc .port{opacity:0}
body.link-to-ind #col-ind .col-body,body.link-to-con #col-con .col-body,body.link-to-ana #col-ana .col-body{outline:2px dashed rgba(31,95,191,.45);outline-offset:-1px;border-radius:12px}
.kc.drop-ok{box-shadow:0 0 0 2px var(--pencil),0 0 0 6px var(--pencil-wash)}
.kc.file-over{box-shadow:0 0 0 2px var(--answer),0 0 0 6px rgba(45,122,75,.12)}
#ws.has-focus .kc:not(.in-chain){opacity:.32}
#ws.searching .kc.miss{opacity:.28}
#ws.searching .kc.hit{background:#FFFBEA}

/* wires */
#wires{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:4}
#wires path{fill:none;stroke-linecap:round}
#wires .w{stroke-width:1.4;opacity:.36;transition:opacity .2s,stroke-width .2s}
#wires .w.off{stroke-dasharray:3 4}
#wires .w.stub{opacity:.5}
#ws.has-focus #wires .w{opacity:.06}
#ws.has-focus #wires .w.in-chain{opacity:.95;stroke-width:2.3}
#wires .w.hot{opacity:.9;stroke-width:2.1}
#wires .hit{stroke:transparent;stroke-width:12;pointer-events:stroke;cursor:pointer}
#wires .tmp{stroke:var(--pencil);stroke-width:2;stroke-dasharray:5 4;opacity:1;pointer-events:none}

/* inspector */
.insp{position:fixed;top:12px;right:12px;bottom:12px;width:min(500px,calc(100vw - 24px));background:#fff;border-radius:14px;box-shadow:0 16px 44px rgba(28,39,51,.24),0 0 0 1px var(--rule-2);z-index:30;display:flex;flex-direction:column;transform:translateX(calc(100% + 28px));transition:transform .22s cubic-bezier(.3,.7,.2,1),visibility 0s linear .22s;visibility:hidden}
.insp.left{right:auto;left:12px;transform:translateX(calc(-100% - 28px))}
/* visible at once when opening (so a field can take focus straight away), hidden only after sliding out */
.insp.open{transform:none;visibility:visible;transition:transform .22s cubic-bezier(.3,.7,.2,1),visibility 0s}
.insp-head{display:flex;align-items:center;gap:6px;padding:12px 12px 10px 18px;border-bottom:1px solid var(--rule-2)}
.kind{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--sans);color:var(--c);padding:5px 9px 5px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 10%,#fff)}
.kind::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.insp-head .sp{flex:1}
.insp-body{overflow:auto;padding:16px 18px 34px;flex:1;scrollbar-width:thin}
.ttl{display:block;width:100%;border:1px solid transparent;border-radius:8px;padding:6px 8px;margin:0 -8px 10px;width:calc(100% + 16px);font:600 18px/1.35 var(--serif);background:transparent}
.ttl:hover{background:#F5F7F9}
.ttl:focus{outline:2px solid var(--pencil);outline-offset:-1px;background:#fff}
.props{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:center;margin:0 0 18px}
.props .pl{font-size:12px;color:var(--ink-2)}
.props input{height:30px;border:1px solid var(--rule);border-radius:7px;padding:0 9px;width:100%;max-width:240px}
.props input:focus{outline:2px solid var(--pencil);outline-offset:-1px;border-color:transparent}
.seg{display:inline-flex;flex-wrap:wrap;gap:5px}
.seg button{border:1px solid var(--rule);background:#fff;border-radius:999px;padding:3px 10px;font-size:12.5px;display:inline-flex;align-items:center;gap:5px;color:var(--ink-2)}
.seg button::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--ink-3))}
.seg button:hover{border-color:#B6C0C9}
.seg button[aria-pressed="true"]{border-color:var(--c,var(--pencil));background:color-mix(in srgb,var(--c,var(--pencil)) 10%,#fff);color:var(--ink);font-weight:600}
.field{margin:0 0 18px}
.lab{display:flex;align-items:baseline;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:6px}
.lab small{font-weight:400;color:var(--ink-3);font-size:11.5px}
.field textarea,.field input[type=text],.field input:not([type]){width:100%;border:1px solid var(--rule);border-radius:8px;padding:7px 10px;background:#fff}
.field textarea{resize:vertical;line-height:1.6}
.field textarea:focus,.field input:focus{outline:2px solid var(--pencil);outline-offset:-1px;border-color:transparent}
.mdt{min-height:96px;font:13.5px/1.62 var(--mono);resize:none;overflow:hidden}
.mdv{position:relative;border-radius:8px;padding:8px 10px;margin:0 -10px;cursor:text;min-height:38px;transition:background-color .15s}
.mdv:hover{background:#F5F7F9}
.mdv:hover::after{content:"点击编辑";position:absolute;right:8px;top:6px;font-size:11px;color:var(--ink-3);background:#F5F7F9;padding:0 2px}
.mdv .ph{color:var(--ink-3);font-size:13px}
.md{font:14.5px/1.66 var(--serif);color:var(--ink);overflow-wrap:anywhere}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p{margin:0 0 .6em}
.md ul,.md ol{margin:0 0 .6em;padding-left:1.4em}
.md li{margin:.15em 0}
.md h1,.md h2,.md h3,.md h4{font-family:var(--sans);font-size:14px;margin:.9em 0 .35em}
.md code{font:12.5px var(--mono);background:#F1F4F6;border-radius:4px;padding:1px 4px}
.md pre{background:#F6F8FA;border-radius:8px;padding:10px 12px;overflow:auto;margin:0 0 .7em}
.md pre code{background:none;padding:0}
.md blockquote{margin:0 0 .6em;padding:2px 0 2px 12px;border-left:3px solid var(--rule);color:var(--ink-2)}
.md table{border-collapse:collapse;margin:0 0 .7em;font:13px/1.5 var(--sans)}
.md th,.md td{border:1px solid var(--rule);padding:4px 8px}
.md th{background:#F6F8FA}
.md a{color:var(--pencil-ink)}
.md .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
.md .katex{font-size:1.06em}
.hint{font-size:12px;color:var(--ink-3);margin:22px 0 0;line-height:1.6}
.hr{height:1px;background:var(--rule-2);margin:6px 0 18px}

/* references */
.ref{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:6px 8px;align-items:start;padding:8px 8px 8px 6px;border-radius:9px;background:#F7F9FA;margin-bottom:6px}
.ref .rn{font:600 12px/30px var(--sans);color:var(--ink-3);text-align:right}
.ref textarea{grid-column:2;min-height:30px;resize:none;overflow:hidden;font:13px/1.55 var(--serif);padding:5px 8px}
.ref input{grid-column:2;height:28px;font-size:12px;padding:0 8px!important}
.ref .ra{grid-column:3;grid-row:1/3;display:flex;flex-direction:column;gap:2px}
.ref a.btn{text-decoration:none;color:var(--pencil-ink)}

/* attachments */
.fil{display:grid;grid-template-columns:42px minmax(0,1fr) auto;column-gap:10px;row-gap:6px;align-items:center;margin-bottom:6px;padding:8px;border-radius:9px;background:#F7F9FA}
.fil.miss{opacity:.6}
.kb{grid-row:1/3;align-self:stretch;width:42px;min-height:46px;border:0;border-radius:7px;background:var(--c);color:#fff;font:700 10px/1 var(--sans);letter-spacing:.03em;cursor:pointer;padding:0;overflow:hidden}
.kb img{width:100%;height:100%;object-fit:cover;display:block}
.kb:hover{filter:brightness(1.08)}
.fil-main{min-width:0;display:flex;align-items:baseline;gap:7px}
.fil-name{min-width:0;border:0;background:none;padding:0;font-weight:600;font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;text-align:left}
.fil-name:hover{color:var(--pencil);text-decoration:underline}
.fil-main small{flex:none;color:var(--ink-3);font-size:11.5px}
.fil-acts{display:flex;gap:1px}
.fil input[type=text]{grid-column:2/4;height:30px;padding:0 9px;border-radius:7px;font-size:12.5px}
.drop{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:1.5px dashed var(--rule);border-radius:9px;padding:13px 12px;text-align:center;color:var(--ink-2);font-size:12.5px;cursor:pointer;background:#FAFBFC;line-height:1.5}
.drop:hover,.drop.over{border-color:var(--pencil);background:var(--pencil-wash);color:var(--pencil-ink)}
.drop u{text-underline-offset:2px}
.frow{display:flex;gap:6px;margin-top:6px}

/* links in the inspector */
.lkgrp{margin-bottom:12px}
.lkgrp .lgt{font-size:12px;color:var(--ink-2);margin-bottom:6px}
.lk{display:flex;gap:6px;align-items:center;padding:6px 6px 6px 10px;border-radius:8px;background:#F7F9FA;margin-bottom:5px;border-left:3px solid var(--c)}
.lk .go{flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;font-size:13px;line-height:1.45;overflow-wrap:anywhere;color:var(--ink)}
.lk .go b{font-weight:650;color:var(--ink-3);margin-right:6px;font-variant-numeric:tabular-nums}
.lk .go:hover{color:var(--pencil-ink)}
.lk .x{border:0;background:none;width:24px;height:24px;border-radius:6px;color:var(--ink-3);flex:none;font-size:16px;line-height:1}
.lk .x:hover{background:#E9EDF0;color:var(--danger)}
.lkbtns{display:flex;gap:6px;flex-wrap:wrap}

/* popover, modal, toast, viewer */
.pop{position:fixed;z-index:50;background:#fff;border-radius:11px;box-shadow:0 12px 36px rgba(28,39,51,.22),0 0 0 1px var(--rule-2);min-width:240px;max-width:min(420px,calc(100vw - 24px));padding:6px}
.pop input[type=search]{width:100%;height:32px;border:1px solid var(--rule);border-radius:7px;padding:0 10px;margin-bottom:6px}
.pop input[type=search]:focus{outline:2px solid var(--pencil);outline-offset:-1px;border-color:transparent}
.pop .opts{max-height:min(360px,58vh);overflow:auto}
.pop .opt{display:flex;gap:8px;align-items:baseline;padding:7px 8px;border-radius:7px;cursor:pointer;line-height:1.45;width:100%;border:0;background:none;text-align:left}
.pop .opt:hover{background:var(--pencil-wash)}
.pop .opt .ck{flex:none;width:15px;height:15px;border-radius:4px;border:1.5px solid var(--rule);display:grid;place-items:center;align-self:center;font-size:10px;color:#fff}
.pop .opt.on .ck{background:var(--pencil);border-color:var(--pencil)}
.pop .opt b{flex:none;color:var(--ink-3);font-weight:650;font-variant-numeric:tabular-nums;min-width:22px}
.pop .opt i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c);align-self:center}
.pop .ttl2{font-size:12px;color:var(--ink-2);padding:4px 8px 6px}
.pop .sep{height:1px;background:var(--rule-2);margin:4px 2px}
.pop .none{color:var(--ink-3);padding:8px;font-size:12.5px}

  document.addEventListener('keydown', key, true);
  back.addEventListener('click', function (e) {
    if (e.target === back) { close(); return; }
    var b = e.target.closest('[data-mb]'); if (!b) return;
    var def = (buttons || [])[+b.dataset.mb]; close(); if (def && def.fn) def.fn();
  });
  return back;
}
function toast(msg, label, fn) {
  var el = $('#toast'); if (!el) return;
  el.innerHTML = '<span>' + esc(msg) + '</span>' + (label ? '<button type="button">' + esc(label) + '</button>' : '');
  el.hidden = false; clearTimeout(toast.t);
  toast.t = setTimeout(function () { el.hidden = true; }, label ? 7000 : 3800);
  if (label) $('button', el).onclick = function () { el.hidden = true; if (fn) fn(); };
}
function showHelp() {
  modal('怎么用这张研究地图',
    '<ul>' +
    '<li><b>三栏</b>：① 想提取的指标 → ② 计量如何构造 → ③ 计量特征结果分析。连线表示“这个指标用在这个构造里”“这个构造支撑这项分析”。</li>' +
    '<li><b>编辑</b>：点任意卡片，右侧会打开编辑面板，改动自动保存。描述、方法、结果等大段文字点一下就能编辑，支持 Markdown 和 LaTeX 公式（如 <code>$\\hat y_i$</code>）。</li>' +
    '<li><b>连线</b>：鼠标移到卡片上，边上会出现小圆点，按住拖到相邻一栏的卡片上；或者在编辑面板最下面「关联」。点一下连线可以删除。</li>' +
    '<li><b>附件</b>：在编辑面板里拖入文件，或直接把文件拖到卡片上。PDF、图片、Word、CSV 可以在网页里直接预览。大文件请放网盘，用「添加网页链接」。</li>' +
    '<li><b>评论</b>：卡片标题旁的气泡按钮，或左下角「评论」。可以回复、标为已解决。</li>' +
    '<li><b>链路</b>：点一张卡片，和它相连的整条链路会高亮，其余变淡；点空白处或按 Esc 取消。</li>' +
    '<li><b>导出</b>：右上角「导出」可以下载整张地图的 Markdown 文档（方便写进论文或发给老师），或 JSON 备份。</li>' +
    '</ul>');
}

/* ---------------- export ---------------- */
function download(name, text, type) {
  var blob = new Blob([text], { type: type || 'text/plain;charset=utf-8' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function safeName(s) { return String(s || '研究地图').replace(/[\\/:*?"<>|]+/g, '').trim() || '研究地图'; }
function exportMarkdown() {
  var d = S.data, L = ['# ' + (d.meta.title || '研究地图'), ''];
  if (d.meta.subtitle) L.push(d.meta.subtitle, '');
  var now = new Date(); L.push('导出时间：' + now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2) + '-' + ('0' + now.getDate()).slice(-2), '');
  function block(label, v) { v = String(v || '').trim(); if (v) L.push('**' + label + '**', '', v, ''); }
  function rel(id, side) {
    var ls = side === 'prev' ? inOf(id) : outOf(id); if (!ls.length) return '';
    return ls.map(function (l) { return labelOf(side === 'prev' ? l.from : l.to); }).join('；');
  }
  COLS.forEach(function (c) {
    L.push('## ' + c.no + '. ' + c.title, '');
    sorted(c.t).forEach(function (o) {
      var meta = [STN[o.status]]; if (c.t === 'ind') meta.unshift((CAT[o.cat] || CAT.other).n); if (o.owner) meta.push('负责人：' + o.owner);
      L.push('### ' + labelOf(o.id), '', '*' + meta.join(' · ') + '*', '');
      FIELDS[c.t].forEach(function (F) {
        if (F.refs) { if ((o.refs || []).length) { L.push('**参考文献**', ''); o.refs.forEach(function (r, i) { L.push((i + 1) + '. ' + (r.text || '') + (r.url ? ' ' + r.url : '')); }); L.push(''); } }
        else block(F.label, o[F.f]);
      });
      if ((o.files || []).length) { L.push('**' + FILE_LABEL[c.t] + '**：' + o.files.map(function (f) { return (f.name || f.url) + (f.note ? '（' + f.note + '）' : ''); }).join('；'), ''); }
      var p = T[c.t].prev ? rel(o.id, 'prev') : '', n = T[c.t].next ? rel(o.id, 'next') : '';
      if (p) L.push('**来自**：' + p, '');
      if (n) L.push('**连到**：' + n, '');
    });
  });
  download(safeName(d.meta.title) + '.md', L.join('\n'), 'text/markdown;charset=utf-8');
}
function exportJSON() {
  var now = new Date(), stamp = now.getFullYear() + ('0' + (now.getMonth() + 1)).slice(-2) + ('0' + now.getDate()).slice(-2);
  download(safeName(S.data.meta.title) + '-备份-' + stamp + '.json', JSON.stringify(S.data, null, 1), 'application/json');
}

/* ---------------- linking by dragging a port ---------------- */
function startLink(e, port) {
  var row = port.closest('.kc'), id = row.dataset.id, t = row.dataset.type, side = port.dataset.port;
  var target = side === 'r' ? T[t].next : T[t].prev; if (!target) return;
  e.preventDefault(); e.stopPropagation();
  closePop();
  var svg = $('#wires'), tmp = svgEl('path', { 'class': 'tmp' }); svg.appendChild(tmp);
  var L = { over: null };
  document.body.classList.add('linking', 'link-to-' + target);
  function move(ev) {
    var wsR = $('#ws').getBoundingClientRect(), pr = port.getBoundingClientRect();
    var x1 = pr.left + pr.width / 2 - wsR.left, y1 = pr.top + pr.height / 2 - wsR.top, x2 = ev.clientX - wsR.left, y2 = ev.clientY - wsR.top, k = (x2 - x1) * 0.5;
    tmp.setAttribute('d', 'M' + x1 + ' ' + y1 + ' C' + (x1 + k) + ' ' + y1 + ' ' + (x2 - k) + ' ' + y2 + ' ' + x2 + ' ' + y2);
    var el = document.elementFromPoint(ev.clientX, ev.clientY), r = el && el.closest ? el.closest('.kc') : null;
    var ok = r && r.dataset.type === target ? r : null;
    if (L.over && L.over !== ok) L.over.classList.remove('drop-ok');
    if (ok) ok.classList.add('drop-ok');
    L.over = ok;
    // dragging near the edge of a column scrolls it
    var body = r ? r.closest('.col-body') : (el && el.closest ? el.closest('.col-body') : null);
    if (body) { var br = body.getBoundingClientRect(); if (ev.clientY < br.top + 30) body.scrollTop -= 12; else if (ev.clientY > br.bottom - 30) body.scrollTop += 12; }
  }
  function up() {
    window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
    tmp.remove(); document.body.classList.remove('linking', 'link-to-' + target);
    var over = L.over; if (over) over.classList.remove('drop-ok');
    if (over) addLink(side === 'r' ? id : over.dataset.id, side === 'r' ? over.dataset.id : id);
  }
  window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  move(e);
}

/* ---------------- events ---------------- */
function bind() {
  var ws = $('#ws'), insp = $('#insp');

  $('#export').addEventListener('click', function (e) {

  });
  $('#tabs').addEventListener('click', function (e) { var b = e.target.closest('[data-tab]'); if (!b) return; S.tab = b.dataset.tab; applyTab(); });
  $('#banner').addEventListener('click', function (e) {
    var b = e.target.closest('[data-banner]'); if (!b) return;

    if (b.dataset.banner === 'reset' && confirm('用示例内容替换当前试用数据？')) { try { localStorage.removeItem('emap-demo-data'); } catch (er) { /* ignore */ } location.reload(); }
  });

  // cards
  ws.addEventListener('pointerdown', function (e) { var p = e.target.closest('.port'); if (p && e.button === 0) startLink(e, p); });
  ws.addEventListener('click', function (e) {
    var add = e.target.closest('[data-add]'); if (add) { createItem(add.dataset.add); return; }

    var card = e.target.closest('.kc');

    if (e.target.closest('.col-head')) return;

  });
  ws.addEventListener('keydown', function (e) {
    var card = e.target.closest && e.target.closest('.kc');

  });
  ws.addEventListener('mouseover', function (e) { var c = e.target.closest('.kc'); var id = c ? c.dataset.id : null; if (id !== S.hotId) { S.hotId = id; setHot(id); } });
  ws.addEventListener('mouseleave', function () { S.hotId = null; setHot(null); });
  $$('.col-body').forEach(function (b) { b.addEventListener('scroll', scheduleWires, { passive: true }); });
  window.addEventListener('resize', function () { scheduleWires(); });
  // files dropped straight onto a card
  ws.addEventListener('dragover', function (e) {
    if (!e.dataTransfer || Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') < 0) return;
    var c = e.target.closest('.kc'); $$('.kc.file-over').forEach(function (x) { if (x !== c) x.classList.remove('file-over'); });
    if (c) { e.preventDefault(); c.classList.add('file-over'); }
  });
  ws.addEventListener('dragleave', function (e) { var c = e.target.closest && e.target.closest('.kc'); if (c && !c.contains(e.relatedTarget)) c.classList.remove('file-over'); });
  ws.addEventListener('drop', function (e) {
    var c = e.target.closest('.kc'); $$('.kc.file-over').forEach(function (x) { x.classList.remove('file-over'); });
    if (!c || !e.dataTransfer || !e.dataTransfer.files.length) return;
    e.preventDefault(); addFiles(c.dataset.id, e.dataTransfer.files);
  });

  // inspector
  insp.addEventListener('input', function (e) {
    var t = e.target, id = S.insp; if (!id) return;
    var o = getObj(id); if (!o) return;
    if (t.dataset.f) {
      setField(id, t.dataset.f, t.value);
      if (t.tagName === 'TEXTAREA') autosize(t);
      return;
    }
    if (t.dataset.ref != null) { var r = o.refs[+t.dataset.ref]; if (r) { r[t.dataset.k] = t.value; softChanged(); if (t.tagName === 'TEXTAREA') autosize(t); } return; }
    if (t.dataset.file != null) { var f = o.files[+t.dataset.file]; if (f) { f.note = t.value; softChanged(); } }
  });
  insp.addEventListener('change', function (e) {

  insp.addEventListener('click', function (e) {
    var t = e.target, id = S.insp, o = getObj(id); if (!o) return;
    var v = t.closest('.mdv'); if (v && !t.closest('a')) { enterEdit(v.closest('[data-mdf]')); return; }

    if (seg) {
      var key = seg.parentNode.dataset.seg, val = seg.dataset.v; if (o[key] === val) return;
      o[key] = val; changed();

    else if (a === 'down') moveItem(id, 1);
    else if (a === 'ref-add') { o.refs.push({ text: '', url: '' }); changed(); openInspector(id, null, true); var ts = $$('.ref textarea', insp); if (ts.length) ts[ts.length - 1].focus(); }
    else if (a === 'ref-del') { o.refs.splice(i, 1); changed(); openInspector(id, null, true); }

    else if (a === 'file-dl') { var f2 = o.files[i]; if (f2) downloadFile(f2); }
    else if (a === 'file-del') { var f3 = o.files[i]; if (f3 && confirm('移除附件「' + (f3.name || f3.url) + '」？')) { o.files.splice(i, 1); changed(); openInspector(id, null, true); } }
    else if (a === 'link-add') {
      var u = prompt('网页链接（网盘、Overleaf、GitHub 等）：', 'https://'); if (!u || !/\S/.test(u.replace(/^https?:\/\/$/, ''))) return;
      var nm = prompt('显示名称：', u.replace(/^https?:\/\//, '').slice(0, 60)); if (nm === null) return;
      o.files.push({ url: u.trim(), name: (nm || u).trim(), note: '' }); changed(); openInspector(id, null, true);
    }
    else if (a === 'unlink') removeLink(b.dataset.l);

  insp.addEventListener('keydown', function (e) {

  insp.addEventListener('dragover', function (e) { var d = e.target.closest('[data-fdrop]'); if (d) { e.preventDefault(); d.classList.add('over'); } });

}
function select(id, opt) {
  if (!IX.byId.has(id)) return;
  if (narrow() && S.tab !== typeOf(id)) { S.tab = typeOf(id); applyTab(); }
  var again = S.focus === id && S.insp === id;
  setFocus(id, { animate: !again, scroll: !!(opt && opt.scroll), self: true });
  if (!again) openInspector(id);
}
function wireMenu(lid, e) {
  var l = IX.lk.get(lid); if (!l) return;
  openPop({ x: e.clientX, y: e.clientY },
    '<div class="ttl2">' + esc(labelOf(l.from)) + ' → ' + esc(labelOf(l.to)) + '</div>' +
    '<button class="opt" data-wgo="' + esc(l.from) + '"><span>查看「' + esc(cut(getObj(l.from).title, 14)) + '」</span></button>' +
    '<button class="opt" data-wgo="' + esc(l.to) + '"><span>查看「' + esc(cut(getObj(l.to).title, 14)) + '」</span></button>' +
    '<div class="sep"></div><button class="opt" data-wdel="' + esc(lid) + '" style="color:var(--danger)"><span>删除这条连线</span></button>', 'menu');

/* ---------------- bridge for cloud.js ---------------- */
window.MapAPI = {
  getData: function () { return clone(S.data); },
  referencedAssets: function (d) { return referencedAssets(d || S.data); },
  setData: function (d, assets) {
    S.cloudApplying = true;
    try {
      S.data = migrate(clone(d));
      Object.keys(assets || {}).forEach(function (k) { if (typeof assets[k] === 'string') S.assets.set(k, assets[k]); });
      renderTop(); render();
      refreshInspector();
    } finally { S.cloudApplying = false; }
  },
  refreshStatus: function () { renderSaveState(); },
  toast: function (m, label, fn) { toast(m, label, fn); },
  labelOf: function (id) {
    var x = IX.byId.get(id); if (!x) return null;
    return { type: x.t, kind: T[x.t].kind, label: labelOf(id), color: colorOf(id) };
  },
  goto: function (id) {
    if (!IX.byId.has(id)) return false;
    if (narrow() && S.tab !== typeOf(id)) { S.tab = typeOf(id); applyTab(); }
    setFocus(id, { scroll: true, self: true, animate: true });
    scrollRowIntoView(id);
    return true;
  },
  getFocus: function () { return S.focus; },
  mode: function () { return 'edit'; },
  redrawWires: function () { scheduleWires(); },

};

/* ---------------- boot ---------------- */
function boot() {
  var seed = null;
  try { var sc = document.getElementById('seed'), txt = sc ? sc.textContent.trim() : ''; seed = txt.charAt(0) === '{' ? JSON.parse(txt) : null; } catch (e) { seed = null; }
  var saved = null;
  if (DEMO) { try { saved = JSON.parse(localStorage.getItem('emap-demo-data') || 'null'); } catch (e) { saved = null; } }
  // On the real site the map comes from GitHub; the cover and loading screen hide the page until it arrives.
  S.data = migrate(clone(DEMO ? (saved || seed || blank()) : blank()));
  renderShell(); bind(); renderTop(); renderBanner(); render();
  if (!DEMO) { var s = document.createElement('script'); s.src = 'cloud.js'; document.body.appendChild(s); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleWires);
}
boot();
})();
